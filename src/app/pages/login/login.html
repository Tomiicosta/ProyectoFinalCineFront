<main>
<section class="loginPage">
  <div class="container">
    <div class="icon-wrap">
      <div class="icon-glow"></div>
      <svg class="user-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="24" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M6 42c0-10 8-16 18-16s18 6 18 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>

    <h2>Iniciar sesión</h2>

    <form [formGroup]="formLogin" (ngSubmit)="onSubmit()" class="formLogin">
  
      <div class="fields">
        <fieldset class="UserField">
          <label for="User">Usuario o Email</label>
          <input type="text" id="User" formControlName="User" placeholder="Ingrese su usuario o email">
          @if(User.invalid && User.touched){
            <p class = "error-message"> Este campo no puede estar vacío.</p>
          }
        </fieldset>
  
        <fieldset class="PasswordField">
          <label for="Password">Contraseña</label>
          <div class="password-input-wrapper"> 
            <input [type]="tipoDeCampo ? 'text' : 'password'" id="Password" formControlName="Password" placeholder="Ingrese su contraseña"> 
        
            <div class="cambiarCampo" >
              <img  [src]="obtenerIcono()" alt="alternar visibilidad de contraseña" class="im" (click)="verContrasenia()">
            </div>
          </div>
          @if(Password.invalid && Password.touched){
            <p class = "error-message"> Este campo no puede estar vacío.</p>
          }
          <p class="olvidasteContrasenia"><a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a></p>
        </fieldset>
      </div>

      <div class="registerText">
        <p>¿No tienes una cuenta?</p>
        <p class="registrate"><a routerLink="/register" class="registrate">Regístrate</a></p>
      </div>
  
      <button class="btnLogin" type="submit" [disabled]="formLogin.invalid || cargando">
        @if (cargando) {
          <span class="spinner" aria-hidden="true"></span>
          <span>Iniciando...</span>
        } @else {
          <span>Iniciar sesión</span>
        }
      </button>
    </form>
  </div>
  
</section>
</main>
